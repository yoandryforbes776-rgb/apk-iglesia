name: Compilar APK Android

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK release y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permiso al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias
        id: tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Mostrar diagnóstico si falla Gradle
        if: failure()
        run: |
          echo '## Diagnóstico de Gradle' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -200 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK release firmada
        id: release
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-release.log

      - name: Mostrar diagnóstico de Release
        if: failure() && steps.release.outcome == 'failure'
        run: |
          echo '## Diagnóstico de APK Release' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -200 gradle-release.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DIAG=$(grep -E '(^e: |FAILURE:|What went wrong|error:|Execution failed)' gradle-release.log | tail -20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
          echo "::error title=Diagnóstico Gradle::$DIAG"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v7
        with:
          name: impulso-joven-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
